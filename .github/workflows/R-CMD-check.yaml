name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  R-CMD-check:
    name: R CMD check on ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent || '' }}

      # 🟩 Install LaTeX per OS
      - name: Install LaTeX on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texinfo \
            ghostscript \
            qpdf \
            pandoc

      - name: Install LaTeX on macOS
        if: runner.os == 'macOS'
        run: |
          brew install --cask mactex-no-gui
          sudo tlmgr update --self --all
          echo "/Library/TeX/texbin" >> $GITHUB_PATH

      - name: Install LaTeX on Windows
        if: runner.os == 'Windows'
        run: |
          choco install miktex.install --params "/NoAutoInstall"
          RefreshEnv
          miktexsetup finish
          initexmf --update-fndb
          initexmf --mklinks --force
          initexmf --mkmaps

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::Rcpp
            any::RcppEigen
            any::RcppArmadillo

      - name: Run R CMD check (with vignettes)
        uses: r-lib/actions/check-r-package@v2
        with:
          args: --as-cran
          build-vignettes: true
          upload-snapshots: true
          build-args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
