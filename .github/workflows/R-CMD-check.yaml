name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    name: R CMD check (Linux)

    steps:
      - uses: actions/checkout@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install LaTeX and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texinfo \
            ghostscript \
            qpdf \
            pandoc

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::Rcpp
            any::RcppEigen
            any::RcppArmadillo

      - name: Check package (CRAN-style)
        uses: r-lib/actions/check-r-package@v2
        with:
          args: --as-cran
          build-vignettes: true
          upload-snapshots: true
          build-args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
